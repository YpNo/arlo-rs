# Reporting only. The enforced gate is `cargo tarpaulin --fail-under`
# in .github/workflows/ci.yml; keep the targets here equal to that
# number so the PR annotation and the gate never disagree.
coverage:
  status:
    project:
      default:
        target: 72%
        threshold: 1%
    patch:
      default:
        target: 72%
        threshold: 0%

ignore:
  - "target/"
  - "tests/"
  - "examples/"
  - "**/*.cargo/"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

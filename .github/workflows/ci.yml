name: Rust CI

on:
  pull_request:
    branches: [ "main", "master"]
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday for security audits

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # boring-sys (BoringSSL, via stealthscraper-rs/wreq) needs cmake, a C++
      # toolchain, libclang for bindgen, nasm and go.
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo clippy
        # `-D warnings` treats every clippy lint as an error. The previous
        # blanket `-A dead_code` allowance was dropped in PR 5 — any
        # genuinely-needed dead code now requires a localised
        # `#[allow(dead_code)]` with a one-line rationale.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # We need cmake, nasm, and go for boring-sys (BoringSSL build)
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go chromium-browser

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo test
        run: cargo test --locked --all-features

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          command: check

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        # Blocks the merge on any RUSTSEC advisory, unmaintained or unsound
        # crate in our dependency tree. Run weekly via the scheduled trigger
        # above. `yanked` is deliberately NOT denied: the lockfile pins the
        # yanked `wreq 5.3.0` on purpose (every wreq 5.x is yanked and
        # stealthscraper-rs has not moved to wreq 6 yet — see Cargo.toml).
        # Restore `--deny warnings` once that dependency is republished.
        # The two ignored `lru 0.13` unsound advisories are pinned by that
        # same `wreq 5.3.0` (`lru = "0.13"`); keep them in sync with
        # `[advisories].ignore` in deny.toml and drop both with the wreq bump.
        run: cargo audit --deny unmaintained --deny unsound --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0253

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check Documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Dependencies for building boring-sys
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go chromium-browser

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-tarpaulin (binary)
        run: |
          curl -s https://api.github.com/repos/xd009642/tarpaulin/releases/latest | grep browser_download_url | grep x86_64-unknown-linux-musl | cut -d '"' -f 4 | xargs curl -L | tar xz -C /usr/local/bin

      - name: Run cargo-tarpaulin
        # Stable toolchain is sufficient for current tarpaulin releases —
        # the previous `cargo +nightly` invocation never installed nightly
        # in this job and only worked by accident.
        #
        # Measured coverage is ~70% (PR 7). The gate is deliberately set
        # 5 points lower (65%) for CI stability — tarpaulin's line
        # attribution fluctuates a percent or two run-to-run, and a gate
        # at the exact measured value produces flaky failures. The
        # remaining ~15 points to the 85% target need three infra
        # investments still pending: a streaming-HTTP mock for the SSE
        # EventBus, an IMAP server mock for the OTP fetcher, and a
        # CloudScraper-boot harness for the production transport path.
        # CHANGELOG.md `[Unreleased]` tracks those as the path to 85%+.
        run: cargo tarpaulin --locked --all-features --workspace --timeout 120 --out xml --fail-under 65

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

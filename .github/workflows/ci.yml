name: Rust CI

# Minutes are metered. A change is gated once, on its own pull request;
# the `plan` job decides what each run deserves and every job keys off
# its outputs:
#   - pull request with code: format → clippy → test → doc, coverage,
#     SonarQube (+ deny, audit, gitleaks). Renovate/Dependabot: no
#     coverage or SonarQube. A release-plz PR (version + changelog only):
#     deny, audit, gitleaks — no build.
#   - push to main after an ordinary merge: gitleaks + the release-pr job
#     only (the code was gated on its PR).
#   - push to main that merges the release PR: format → clippy → test
#     (+ deny, audit, gitleaks), then publish. No coverage.
#   - weekly schedule: audits plus one coverage/SonarQube baseline on main.
#   - workflow_dispatch: gates, then publish a hand-set version.
# Docs-only changes never trigger it (paths-ignore).
on:
  pull_request:
    branches: [ "main", "master"]
    paths-ignore: # keep in step with `push` below
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE*"
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE*"
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday for security audits
  workflow_dispatch: # a release with a hand-set version: run the gates, then publish

env:
  CARGO_TERM_COLOR: always

# Read-only token for every job; the release job widens its own scope.
permissions:
  contents: read

# A new push to the same PR supersedes the running workflow. Pushes to
# main queue instead: cancelling a main run could abort a release that
# is already creating its tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build: ${{ steps.plan.outputs.build }}
      docs: ${{ steps.plan.outputs.docs }}
      coverage: ${{ steps.plan.outputs.coverage }}
      sonar: ${{ steps.plan.outputs.sonar }}
      audits: ${{ steps.plan.outputs.audits }}
      secrets: ${{ steps.plan.outputs.secrets }}
      release: ${{ steps.plan.outputs.release }}
      release_pr: ${{ steps.plan.outputs.release_pr_job }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # Decide once what this run deserves; every job keys off these outputs.
          # Minutes are metered: a change is gated on its own pull request, and a
          # push to main re-runs the build only for the release merge about to be
          # published. Anything else that runs on main is cheap or scheduled.
          is() { [ "$1" = "true" ]; }
          is_pr=false; [ "$EVENT" = pull_request ] && is_pr=true
          main_push=false; [ "$EVENT" = push ] && main_push=true
          release_pr=false; is $is_pr && case "$HEAD_REF" in release-plz*) release_pr=true;; esac
          bot_pr=false; is $is_pr && case "$ACTOR" in 'renovate[bot]'|'dependabot[bot]') bot_pr=true;; esac
          fork_pr=false; is $is_pr && [ "$PR_REPO" != "$REPO" ] && fork_pr=true
          release_push=false; is $main_push && case "$HEAD_MSG" in 'chore: release'*) release_push=true;; esac
          dispatch=false; [ "$EVENT" = workflow_dispatch ] && dispatch=true
          schedule=false; [ "$EVENT" = schedule ] && schedule=true

          build=false;    { { is $is_pr && ! is $release_pr; } || is $release_push || is $dispatch || is $schedule; } && build=true
          docs=false;     { is $is_pr && ! is $release_pr; } && docs=true
          coverage=false; { { is $is_pr && ! is $release_pr && ! is $bot_pr; } || is $schedule; } && coverage=true
          sonar=false;    { is $coverage && ! is $fork_pr && [ "$ACTOR" != 'dependabot[bot]' ]; } && sonar=true
          audits=false;   { is $is_pr || is $release_push || is $dispatch || is $schedule; } && audits=true
          secrets=false;  { is $is_pr || is $main_push; } && secrets=true
          release=false;  { is $release_push || is $dispatch; } && release=true
          release_pr_job=false; { is $main_push && ! is $release_push; } && release_pr_job=true

          for k in build docs coverage sonar audits secrets release release_pr_job; do
            eval v=\$$k; echo "$k=$v" >> "$GITHUB_OUTPUT"; echo "$k=$v"
          done
          { echo "### Plan for \`$EVENT\`"; echo; echo '| job group | runs |'; echo '|---|---|';
            for k in build docs coverage sonar audits secrets release release_pr_job; do eval v=\$$k; echo "| $k | $v |"; done; } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root of the build chain: everything below `needs` this job, so a
    # run the plan keeps build-free stops here.
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    # A cold BoringSSL build is the long pole (~15 min); cached runs take
    # a few minutes.
    timeout-minutes: 45
    needs: [format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # btls-sys (BoringSSL, via stealthscraper-rs/wreq) needs cmake, a C++
      # toolchain, libclang for bindgen, nasm and go.
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run cargo clippy
        # `-D warnings` treats every clippy lint as an error. The previous
        # blanket `-A dead_code` allowance was dropped in PR 5 — any
        # genuinely-needed dead code now requires a localised
        # `#[allow(dead_code)]` with a one-line rationale.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [clippy] # same build, warmed by clippy's cache; a lint failure skips it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # We need cmake, nasm, and go for boring-sys (BoringSSL build)
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run cargo test
        # The live-account test in tests/e2e_arlo_api.rs is `#[ignore]`
        # and additionally requires ARLO_E2E=1; CI never runs it.
        run: cargo test --locked --all-features

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan]
    if: needs.plan.outputs.audits == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan]
    if: needs.plan.outputs.secrets == 'true'
    # On pull_request events the action lists the PR's commits through the
    # API, which needs pull-requests: read. Comments are off so write access
    # is never required; findings fail the job and show in the log.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action diffs the pushed / PR commit range
      - name: Run gitleaks
        # Rules and allow-list live in .gitleaks.toml. No license key is
        # needed for a personal-account repository. Findings fail the job.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan]
    if: needs.plan.outputs.audits == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-audit
        # Prebuilt binary, exact version, checksum verified by the action's
        # signed manifest — no `cargo install` of whatever is newest.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - name: Run cargo audit
        # Blocks the merge on any RUSTSEC advisory, unmaintained, unsound
        # or yanked crate in our dependency tree. Run weekly via the
        # scheduled trigger above. Advisory ignores, if one is ever
        # needed, must be mirrored in `[advisories].ignore` in deny.toml.
        run: cargo audit --deny warnings

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, test]
    # Only where the plan allows: code PRs from this repository (the token
    # is withheld from forks and Dependabot) and the weekly baseline.
    if: needs.plan.outputs.sonar == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [plan, clippy]
    if: needs.plan.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check Documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, test]
    # The costliest job (instrumented rebuild): code PRs from people and
    # the weekly baseline on main; never a dependency bump or a release.
    if: needs.plan.outputs.coverage == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependencies for building boring-sys
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-tarpaulin
        # Exact version, checksum verified. The previous step downloaded
        # the newest GitHub release unverified and ran it against the
        # full test suite in the job that also holds CODECOV_TOKEN.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-tarpaulin@0.37.4

      - name: Run cargo-tarpaulin
        # Stable toolchain is sufficient for current tarpaulin releases —
        # the previous `cargo +nightly` invocation never installed nightly
        # in this job and only worked by accident.
        #
        # `--fail-under` is THE coverage gate; codecov.yml mirrors the same
        # number for the PR annotation. Keep the two in sync. Measured
        # 78.4 % on 2026-09-26 (338 tests, llvm engine); the gate sits a
        # few points below because tarpaulin's line attribution moves a
        # percent or two between runs and engines, and a gate at the exact
        # value is flaky. The remaining uncovered paths are the IMAP
        # fetcher (needs an IMAP server double), the local-hub client's
        # request methods and the opt-in browser-proxy transport.
        # `manual_examples/` are probes against a live account, never run
        # by the suite; codecov.yml ignores the same path.
        run: cargo tarpaulin --locked --all-features --workspace --timeout 120 --out xml --fail-under 72 --exclude-files 'manual_examples/*'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Reporting only: tarpaulin's `--fail-under` above is the gate,
          # so a Codecov outage must not fail the pipeline.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # release-plz: two jobs, both only after every gate is green on a push to
  # the default branch (SonarQube is an external service and does not hold a
  # release back). `release-pr` maintains the "chore: release" PR (version
  # bump + CHANGELOG section from Conventional Commits); `release` publishes
  # to crates.io, tags `v<version>` and creates the GitHub release whenever
  # main carries a version that is not on crates.io yet. RELEASE_PLZ_TOKEN is
  # a fine-grained PAT (contents + pull-requests: write) so that CI runs on
  # the release PR — workflows never trigger on PRs opened with GITHUB_TOKEN.
  release-plz-release:
    name: release-plz (publish + tag)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The release merge (its squash title leads the commit message) or a
    # manual dispatch: the build gates ran on this very commit just above.
    needs: [plan, format, clippy, test, security, secrets, audit]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags decide what the last release was
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # `cargo publish` verifies the package with a clean build: BoringSSL
      # needs the same toolchain as the other jobs.
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run release-plz release
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-plz (release PR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every ordinary push to main may need a release PR. It depends on no
    # gate: the merged code was gated on its own PR, and the release PR it
    # opens is gated again when merged.
    needs: [plan]
    if: needs.plan.outputs.release_pr == 'true'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # cargo-semver-checks builds rustdoc JSON for both versions.
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libclang-dev nasm golang-go
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run release-plz release-pr
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

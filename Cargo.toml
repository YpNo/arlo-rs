[package]
name = "rs-arlo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1.52", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "fast-rng"] }
urlencoding = "2.1"
toml = "1.1"
# Once `rs-cloudscraper` v0.2.0 is verified against this crate's call sites, swap to:
# rs-cloudscraper = { git = "https://github.com/YpNo/rs-cloudscraper", tag = "v0.2.0", features = ["browser"] }
# (Tracked in CHANGELOG.md under [Unreleased].)
rs-cloudscraper = { path = "../rs-cloudscraper", features = ["browser"] }
mailparse = "0.16.1"
regex = "1.12.3"
imap-client = { path = "../imap-rs/imap-client" }
imap-core = { path = "../imap-rs/imap-core" }
imap-tls = { path = "../imap-rs/imap-tls" }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
chrono = "0.4.44"
flate2 = "1.1.9"
base64 = "0.22.1"
tracing = "0.1"
tracing-futures = "0.2"
secrecy = "0.10"
async-trait = "0.1"


[dev-dependencies]
tempfile = "3.26.0"
mockito = "1.6.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

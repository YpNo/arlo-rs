[package]
name = "rs-arlo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50.0", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
log = "0.4"
urlencoding = "2.1"
toml = "0.8"
rs-cloudscraper = { git = "https://github.com/YpNo/rs-cloudscraper", tag = "v0.2.0" }
native-tls = "0.2.18"
mailparse = "0.16.1"
regex = "1.12.3"
imap = "3.0.0-alpha.15"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.26.0"

[package]
name = "arlo-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A high-level, asynchronous Rust client for Arlo security cameras, supporting MFA, MQTT event streaming, and WebRTC signaling."
repository = "https://github.com/YpNo/arlo-rs"
readme = "README.md"
keywords = ["arlo", "camera", "iot", "security", "webrtc"]
categories = ["api-bindings", "asynchronous"]
exclude = [
    "target/",
    ".agents/",
    ".claude/",
    ".github/",
    ".gitignore",
    "CONTEXT.md",
    "GEMINI.md",
    "CLAUDE.md",
    ".vscode/",
    "examples/",
    "manual_examples/",
    "tests/",
    "*.json",
]

[dependencies]
tokio = { version = "1.52", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "fast-rng"] }
urlencoding = "2.1"
toml = "1.1"
# Sibling checkout (branch `chore/p0-lean-dependencies`, v1.0.0). The crates.io
# 0.4.0 release cannot be resolved from a clean lock: it requires `wreq 5.3.0`,
# and every wreq 5.x is yanked. Cargo.lock pins the yanked wreq on purpose —
# build with `--locked`. Switch back to a version req once stealthscraper-rs
# publishes against wreq 6.
stealthscraper-rs = { path = "../stealthscraper-rs", features = ["browser"] }
mailparse = "0.16.1"
regex = "1.12.3"
imap-rs-client = "0.2.1"
imap-rs-core = "0.2.1"
imap-rs-tls = "0.2.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
chrono = "0.4.44"
flate2 = "1.1.9"
base64 = "0.22.1"
tracing = "0.1"
tracing-futures = "0.2"
secrecy = "0.10"
async-trait = "0.1"
# MQTT-over-WebSocket event bus (v3 replacement for the dead SSE
# `/hmsweb/client/subscribe`). tokio-tungstenite gives full control of
# Arlo's non-standard WS handshake (custom Origin + `mqtt` subprotocol);
# mqttbytes is rumqttc's MQTT 3.1.1 packet codec (no broker runtime).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
mqttbytes = "0.6"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# NOTE: arlo-rs is **signaling-only** for v3 live. The WebRTC media
# plane lives in the consumer (the streamer's GStreamer `webrtcbin`) —
# Arlo's gateway is non-bundled FreeSWITCH, which the pure-Rust `webrtc`
# crate cannot negotiate. No WebRTC dependency here by design.


[dev-dependencies]
tempfile = "3.26.0"
mockito = "1.6.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Manual, live-account smoke tests (not autodiscovered — they live in
# `manual_examples/`, not `examples/`). Run with `cargo run --example <name>`.
[[example]]
name = "list_cameras"
path = "manual_examples/list_cameras.rs"

[[example]]
name = "push_login"
path = "manual_examples/push_login.rs"
